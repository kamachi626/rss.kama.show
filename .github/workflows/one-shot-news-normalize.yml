name: One-shot news feed normalization
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-news-normalize.yml
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize dedupe and recommendations
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from email.utils import format_datetime

          GENERATED_AT = "2026-09-01T21:45:25+09:00"
          TOP = ["anthropic-agent-unauthorized-actions-2026-09-01","global-bond-rout-jgb-3pct-2026-09-01","claude-code-weekly-limit-2026-09-01","sanyo-paul-stuart-golf-matsuya-ginza-2026-09-01","lmstudio-bionic-linux-2026-09-01"]
          DROP_IDS = {"japan-jgb-10y-3pct-2026-09-01"}
          CATEGORIES = ["テック・開発","経済・企業","旅行・モビリティ","科学・知識","ローカル・ライフ"]

          with open("feed.json", encoding="utf-8") as f:
              feed = json.load(f)
          with open("archive/2026-09-01.json", encoding="utf-8") as f:
              archive = json.load(f)

          feed_items = [x for x in feed.get("items", []) if x.get("id") not in DROP_IDS]
          archive_items = [x for x in archive.get("items", []) if x.get("id") not in DROP_IDS]
          known = {x.get("id") for x in feed_items}
          if any(x not in known for x in TOP):
              raise RuntimeError("top item missing from feed")

          feed_out = {"version":1,"generated_at":GENERATED_AT,"categories":CATEGORIES,"top":TOP,"items":feed_items}
          archive_out = {"version":1,"generated_at":GENERATED_AT,"categories":CATEGORIES,"top":TOP,"items":archive_items}
          with open("feed.json", "w", encoding="utf-8") as f:
              json.dump(feed_out, f, ensure_ascii=False, separators=(",", ":"))
          with open("archive/2026-09-01.json", "w", encoding="utf-8") as f:
              json.dump(archive_out, f, ensure_ascii=False, separators=(",", ":"))

          rss = ET.Element("rss", version="2.0")
          channel = ET.SubElement(rss, "channel")
          ET.SubElement(channel, "title").text = "kama.show Personalized News"
          ET.SubElement(channel, "link").text = "https://rss.kama.show/"
          ET.SubElement(channel, "description").text = "Personalized news feed"
          ET.SubElement(channel, "lastBuildDate").text = format_datetime(datetime.fromisoformat(GENERATED_AT))
          for item in feed_items:
              node = ET.SubElement(channel, "item")
              ET.SubElement(node, "title").text = item["title"]
              ET.SubElement(node, "link").text = item["url"]
              guid = ET.SubElement(node, "guid", {"isPermaLink":"false"}); guid.text = item["id"]
              if item.get("published_at"):
                  try: ET.SubElement(node, "pubDate").text = format_datetime(datetime.fromisoformat(item["published_at"]))
                  except Exception: pass
              ET.SubElement(node, "category").text = item["category"]
              ET.SubElement(node, "description").text = item["summary"]
          tree = ET.ElementTree(rss); ET.indent(tree, space="  "); tree.write("feed.xml", encoding="utf-8", xml_declaration=True)
          PY
          rm -f .github/workflows/one-shot-news-normalize.yml
          git config user.name "kama.show news automation"
          git config user.email "actions@users.noreply.github.com"
          git add feed.json feed.xml archive/2026-09-01.json .github/workflows/one-shot-news-normalize.yml
          git commit -m "Normalize 2026-09-01 news feed and TOP 5"
          git push origin HEAD:main
