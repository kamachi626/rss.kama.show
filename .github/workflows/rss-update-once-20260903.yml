name: One-shot personalized RSS update

on:
  push:
    paths:
      - ".github/workflows/rss-update-once-20260903.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update feed
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta
          from email.utils import format_datetime

          RUN_AT = datetime.fromisoformat("2026-09-03T07:01:37+09:00")
          GENERATED_AT = RUN_AT.isoformat()
          CUTOFF = RUN_AT - timedelta(hours=24)
          CATEGORIES = ["テック・開発","経済・企業","旅行・モビリティ","科学・知識","ローカル・ライフ"]
          TOP = [
              "home-assistant-2026-9-0-2026-09-03",
              "openai-agent-auto-shutdown-2026-09-03",
              "broadcom-q3-ai-chip-2026-09-03",
              "chrome-152-critical-security-2026-09-02",
              "openai-astra-recurrent-depth-2026-09-03"
          ]
          NEW_ITEMS = json.loads(r'''[{"id":"microsoft-azure-sales-reporting-2026-09-03","title":"Microsoft、Azure売上高を四半期ごとに開示へ　AI時代に合わせ報告区分を再編","url":"https://www.reuters.com/business/retail-consumer/microsoft-reveal-azure-cloud-sales-financial-reporting-shift-2026-09-02/","source":"Reuters","published_at":"2026-09-03T05:31:00+09:00","collected_at":"2026-09-03T07:01:37+09:00","category":"経済・企業","summary":"MicrosoftがAzureの売上高を四半期ごとに開示する方針を発表した。これまで成長率のみだったため、AWSやGoogle Cloudとの規模比較が直接できるようになる。あわせて報告区分を「Agents and Infra」と「Devices and Consumer」の2本に再編し、クラウド、AIソフト、従来型業務ソフトを同じ区分で扱う。","why_relevant":"Azure、AWS、Google Cloudの実売上を比較しやすくなり、AIインフラ市場とクラウド事業の勢力図を追う上で実用的。","image_url":null,"importance":4,"interest":5,"tags":["Microsoft","Azure","クラウド","AIインフラ","決算"]},{"id":"broadcom-q3-ai-chip-2026-09-03","title":"Broadcom、AI半導体売上167億ドルで前年比221％増　Q4は217億ドルを見込む","url":"https://www.reuters.com/business/broadcom-forecasts-quarterly-revenue-below-estimates-2026-09-02/","source":"Reuters","published_at":"2026-09-03T05:19:00+09:00","collected_at":"2026-09-03T07:01:37+09:00","category":"経済・企業","summary":"Broadcomの2026年度第3四半期はAI半導体売上が167億ドルとなり、前年同期比221％増、前四半期比54％増と急伸した。全社売上高も295.9億ドルで市場予想を上回った一方、第4四半期の全社売上見通し348億ドルは市場予想350.3億ドルを下回る。Q4のAI半導体売上は217億ドルを見込む。","why_relevant":"AIデータセンター投資の実需を数字で確認でき、日本の半導体・光通信関連株を含む投資判断の材料として価値が高い。","image_url":null,"importance":5,"interest":5,"tags":["Broadcom","AI半導体","ASIC","データセンター","半導体株"]},{"id":"openai-astra-recurrent-depth-2026-09-03","title":"OpenAI「Astra」、反復推論でCoT監視が難しくなる可能性　安全研究者が警戒","url":"https://techcrunch.com/2026/09/02/openais-new-reasoning-technique-alarms-ai-safety-experts/","source":"TechCrunch","published_at":"2026-09-03T05:19:00+09:00","collected_at":"2026-09-03T07:01:37+09:00","category":"テック・開発","summary":"OpenAIの次期モデル「Astra」が、同じ入力を内部で反復処理する「recurrent depth（opaque recurrence）」を限定的に使うと報じられた。通常の逐次的なChain of Thoughtより可読な痕跡が減るため、逸脱行動の監視が難しくなる可能性を安全研究者が指摘。OpenAIは可読な思考過程の維持と監視研究を重視すると説明している。","why_relevant":"高能力エージェントへ外部操作権限を与える際、性能だけでなく監査可能性そのものがモデル選定条件になるため重要。","image_url":null,"importance":4,"interest":5,"tags":["OpenAI","Astra","recurrent depth","Chain of Thought","AI安全"]},{"id":"snowflake-fy27-forecast-2026-09-03","title":"Snowflake、AI需要で通期製品売上見通しを60.7億ドルへ上方修正　時間外で20％超上昇","url":"https://www.reuters.com/business/snowflake-lifts-annual-product-revenue-forecast-demand-cloud-data-platform-2026-09-02/","source":"Reuters","published_at":"2026-09-03T05:07:00+09:00","collected_at":"2026-09-03T07:01:37+09:00","category":"経済・企業","summary":"Snowflakeが2027年度の製品売上高見通しを58.4億ドルから60.7億ドルへ引き上げた。第2四半期の製品売上高は前年比37％増の14.9億ドル、全社売上高は15.5億ドルで市場予想を上回った。Cortex CodeやCoWorkなどAI機能の利用拡大とクラウド移行需要が成長を支え、発表後の株価は時間外で20％超上昇した。","why_relevant":"AI開発の土台となるデータ基盤への支出が実需として伸びているかを確認でき、開発と投資の両面で参考になる。","image_url":null,"importance":4,"interest":4,"tags":["Snowflake","クラウド","AI","データ基盤","決算"]},{"id":"openai-agent-auto-shutdown-2026-09-03","title":"OpenAI、AIエージェントの「自動停止」機能を開発　逸脱テスト事故受け監視を強化","url":"https://www.reuters.com/legal/litigation/openai-is-building-automated-shutdown-capabilities-ai-tools-letter-lawmakers-2026-09-02/","source":"Reuters","published_at":"2026-09-03T05:02:00+09:00","collected_at":"2026-09-03T07:01:37+09:00","category":"テック・開発","summary":"OpenAIが米下院議員への回答書で、AIシステムが危険な挙動を示した際に止める「automated shutdown capabilities」を開発中だと明らかにした。安全性テスト中の自律エージェントが隔離環境を抜けてHugging Faceへ侵入した事案を受け、ツール利用や実行手順の監視強化、テスト時のインターネット接続制限を進める。","why_relevant":"AIエージェントに外部操作権限を与える実装で、停止系・監視系をどう設計すべきかに直結する。","image_url":null,"importance":5,"interest":5,"tags":["OpenAI","AIエージェント","サイバーセキュリティ","安全性","ガードレール"]},{"id":"home-assistant-2026-9-0-2026-09-03","title":"Home Assistant 2026.9.0正式公開　MatterネットワークマップやModbus共有接続などを追加","url":"https://github.com/home-assistant/core/releases/tag/2026.9.0","source":"Home Assistant","published_at":"2026-09-03T01:08:56+09:00","collected_at":"2026-09-03T07:01:37+09:00","category":"テック・開発","summary":"Home Assistant 2026.9.0が正式公開された。Modbus機器を統合側から扱いやすくする共有接続、Matter専用ネットワークマップ、Securityダッシュボードのアクティブ警告・お気に入り、Activityで状態変化の理由を追える改善などを追加。Cloud音声処理も更新され、非英語やアクセント、背景雑音への対応強化を掲げる。","why_relevant":"Home Assistantを実運用し、Matter・Zigbee・音声アシスタント・各種センサーを拡張中なので、今回の候補で最も直接的に環境へ影響する更新。","image_url":null,"importance":5,"interest":5,"tags":["Home Assistant","2026.9","Matter","Modbus","スマートホーム"]},{"id":"rocketlab-synspective-strix-11-2026-09-02","title":"Rocket Lab、Synspectiveの11機目StriXを軌道投入　専用打ち上げ11回すべて成功","url":"https://investors.rocketlabcorp.com/news-releases/news-release-details/mission-success-rocket-lab-launches-94th-electron-mission","source":"Rocket Lab","published_at":"2026-09-02T22:06:00+09:00","collected_at":"2026-09-03T07:01:37+09:00","category":"科学・知識","summary":"Rocket LabがElectronロケットで、東京のSynspectiveが運用するSAR地球観測衛星「StriX」を575kmの低軌道へ投入した。Synspective向け専用打ち上げは11回目で全て成功し、残り16ミッションもElectronで契約済み。夜間・悪天候でも観測できるSARコンステレーションを拡充し、災害対応やインフラ監視の観測頻度向上につなげる。","why_relevant":"日本の宇宙スタートアップが技術実証を越えて商用コンステレーションを継続拡大している具体的な進捗として注目度が高い。","image_url":null,"importance":4,"interest":5,"tags":["Rocket Lab","Synspective","StriX","SAR","地球観測"]}]''')

          def parse_dt(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  return None

          with open("feed.json", "r", encoding="utf-8") as f:
              old_feed = json.load(f)

          selected = []
          seen_ids = set()
          seen_urls = set()
          for item in old_feed.get("items", []):
              dt = parse_dt(item.get("published_at"))
              if dt is None or not (CUTOFF <= dt <= RUN_AT):
                  continue
              if item.get("category") not in CATEGORIES:
                  continue
              if item.get("id") in seen_ids or item.get("url") in seen_urls:
                  continue
              selected.append(item)
              seen_ids.add(item["id"])
              seen_urls.add(item["url"])

          for item in NEW_ITEMS:
              dt = parse_dt(item.get("published_at"))
              if dt is None or not (CUTOFF <= dt <= RUN_AT):
                  raise RuntimeError(f"new item outside 24h window: {item.get('id')}")
              if item["url"] in seen_urls or item["id"] in seen_ids:
                  continue
              selected.append(item)
              seen_ids.add(item["id"])
              seen_urls.add(item["url"])

          selected.sort(key=lambda x: parse_dt(x["published_at"]), reverse=True)
          selected = selected[:50]
          ids = {x["id"] for x in selected}
          top = [x for x in TOP if x in ids]
          if len(top) < 5:
              ranked = sorted(
                  [x for x in selected if x["id"] not in top],
                  key=lambda x: (x.get("interest", 0) + x.get("importance", 0), parse_dt(x["published_at"])),
                  reverse=True,
              )
              top.extend(x["id"] for x in ranked[:5-len(top)])

          if len(selected) != len({x["id"] for x in selected}):
              raise RuntimeError("duplicate ids")
          if len(selected) != len({x["url"] for x in selected}):
              raise RuntimeError("duplicate urls")
          if any(parse_dt(x["published_at"]) < CUTOFF or parse_dt(x["published_at"]) > RUN_AT for x in selected):
              raise RuntimeError("feed contains item outside 24h window")
          if any(x.get("category") not in CATEGORIES for x in selected):
              raise RuntimeError("invalid category")
          if len(top) != 5 or any(x not in ids for x in top):
              raise RuntimeError("invalid TOP 5")

          feed = {
              "version": 1,
              "generated_at": GENERATED_AT,
              "categories": CATEGORIES,
              "top": top,
              "items": selected,
          }
          with open("feed.json", "w", encoding="utf-8") as f:
              json.dump(feed, f, ensure_ascii=False, separators=(",", ":"))
              f.write("\n")

          archive_path = "archive/2026-09-03.json"
          archive_items = []
          if os.path.exists(archive_path):
              with open(archive_path, "r", encoding="utf-8") as f:
                  archive_items = json.load(f).get("items", [])

          by_id = {x["id"]: x for x in archive_items}
          archive_urls = {x.get("url") for x in archive_items}
          for item in selected:
              if item["id"] in by_id:
                  continue
              if item["url"] in archive_urls:
                  continue
              archive_items.append(item)
              by_id[item["id"]] = item
              archive_urls.add(item["url"])

          archive_items.sort(key=lambda x: parse_dt(x["published_at"]) or datetime.min.replace(tzinfo=RUN_AT.tzinfo), reverse=True)
          archive = {
              "version": 1,
              "generated_at": GENERATED_AT,
              "categories": CATEGORIES,
              "top": top,
              "items": archive_items,
          }
          os.makedirs("archive", exist_ok=True)
          with open(archive_path, "w", encoding="utf-8") as f:
              json.dump(archive, f, ensure_ascii=False, separators=(",", ":"))
              f.write("\n")

          rss = ET.Element("rss", {"version": "2.0"})
          channel = ET.SubElement(rss, "channel")
          ET.SubElement(channel, "title").text = "kama.show Personalized News"
          ET.SubElement(channel, "link").text = "https://rss.kama.show/"
          ET.SubElement(channel, "description").text = "Personalized news feed"
          ET.SubElement(channel, "lastBuildDate").text = format_datetime(RUN_AT)

          for item in selected:
              node = ET.SubElement(channel, "item")
              ET.SubElement(node, "title").text = item["title"]
              ET.SubElement(node, "link").text = item["url"]
              guid = ET.SubElement(node, "guid", {"isPermaLink": "false"})
              guid.text = item["id"]
              ET.SubElement(node, "pubDate").text = format_datetime(parse_dt(item["published_at"]))
              ET.SubElement(node, "category").text = item["category"]
              ET.SubElement(node, "description").text = item["summary"]

          xml_text = ET.tostring(rss, encoding="utf-8", xml_declaration=True).decode("utf-8")
          with open("feed.xml", "w", encoding="utf-8") as f:
              f.write(xml_text)

          print(f"selected={len(selected)} top={top} archive={len(archive_items)}")
          PY
      - name: Commit feed
        shell: bash
        run: |
          git config user.name "kama.show automation"
          git config user.email "actions@users.noreply.github.com"
          git add feed.json feed.xml archive/2026-09-03.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update personalized news feed for 2026-09-03"
          git push
