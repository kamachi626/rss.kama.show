name: Sync RSS from feed.json

on:
  push:
    paths:
      - '.github/workflows/sync-rss.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate feed.xml from feed.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          import email.utils
          from datetime import datetime
          from xml.sax.saxutils import escape

          with open('feed.json', encoding='utf-8') as f:
              feed = json.load(f)

          generated = datetime.fromisoformat(feed['generated_at'])
          parts = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom"><channel>',
              '<title>Kama Personal News</title>',
              '<link>https://github.com/kamachi626/rss.kama.show</link>',
              '<description>ChatGPTが興味適合度を基に選定したパーソナルニュースフィード</description>',
              '<language>ja</language>',
              f'<lastBuildDate>{escape(email.utils.format_datetime(generated))}</lastBuildDate>',
              '<atom:link href="https://raw.githubusercontent.com/kamachi626/rss.kama.show/main/feed.xml" rel="self" type="application/rss+xml"/>'
          ]

          for item in feed['items']:
              published = datetime.fromisoformat(item['published_at'])
              title = escape(item['title'])
              url = escape(item['url'])
              category = escape(item['category'])
              description = (item['summary'] + '<br/><br/><strong>なぜ注目:</strong> ' + item['why_relevant']).replace(']]>', ']]]]><![CDATA[>')
              parts.append(
                  f'<item><title>{title}</title><link>{url}</link><guid isPermaLink="true">{url}</guid>'
                  f'<pubDate>{escape(email.utils.format_datetime(published))}</pubDate><category>{category}</category>'
                  f'<description><![CDATA[{description}]]></description></item>'
              )

          parts.append('</channel></rss>')
          with open('feed.xml', 'w', encoding='utf-8') as f:
              f.write(''.join(parts))
          PY
      - name: Commit RSS sync
        shell: bash
        run: |
          if git diff --quiet -- feed.xml; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed.xml
          git commit -m 'Sync feed.xml from feed.json'
          git push
