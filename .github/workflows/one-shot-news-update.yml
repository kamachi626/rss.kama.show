name: One-shot personalized news update
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-news-update.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge selected news and regenerate feeds
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from datetime import datetime
          from email.utils import format_datetime

          CATEGORIES = ["テック・開発","経済・企業","旅行・モビリティ","科学・知識","ローカル・ライフ"]
          with open(".github/news-update-payload.json", encoding="utf-8") as f:
              payload = json.load(f)
          with open("feed.json", encoding="utf-8") as f:
              feed = json.load(f)
          with open("archive/2026-09-01.json", encoding="utf-8") as f:
              archive = json.load(f)

          def parse_dt(value):
              try:
                  return datetime.fromisoformat(value)
              except Exception:
                  return datetime.min.astimezone()

          def merge(existing, incoming):
              out, ids, urls = [], set(), set()
              for item in list(existing) + list(incoming):
                  iid, url = item.get("id"), item.get("url")
                  if iid in ids or url in urls:
                      continue
                  ids.add(iid); urls.add(url); out.append(item)
              return out

          feed_items = merge(feed.get("items", []), payload["items"])
          feed_items.sort(key=lambda x: parse_dt(x.get("published_at")), reverse=True)
          feed_items = feed_items[:50]
          feed_out = {"version":1,"generated_at":payload["generated_at"],"categories":CATEGORIES,"top":payload["top"],"items":feed_items}
          archive_items = merge(archive.get("items", []), payload["items"])
          archive_out = {"version":1,"generated_at":payload["generated_at"],"categories":CATEGORIES,"top":payload["top"],"items":archive_items}

          with open("feed.json", "w", encoding="utf-8") as f:
              json.dump(feed_out, f, ensure_ascii=False, separators=(",", ":"))
          with open("archive/2026-09-01.json", "w", encoding="utf-8") as f:
              json.dump(archive_out, f, ensure_ascii=False, separators=(",", ":"))

          rss = ET.Element("rss", version="2.0")
          channel = ET.SubElement(rss, "channel")
          ET.SubElement(channel, "title").text = "kama.show Personalized News"
          ET.SubElement(channel, "link").text = "https://rss.kama.show/"
          ET.SubElement(channel, "description").text = "Personalized news feed"
          ET.SubElement(channel, "lastBuildDate").text = format_datetime(datetime.fromisoformat(payload["generated_at"]))
          for item in feed_items:
              node = ET.SubElement(channel, "item")
              ET.SubElement(node, "title").text = item["title"]
              ET.SubElement(node, "link").text = item["url"]
              guid = ET.SubElement(node, "guid", {"isPermaLink":"false"}); guid.text = item["id"]
              if item.get("published_at"):
                  try: ET.SubElement(node, "pubDate").text = format_datetime(datetime.fromisoformat(item["published_at"]))
                  except Exception: pass
              ET.SubElement(node, "category").text = item["category"]
              ET.SubElement(node, "description").text = item["summary"]
          tree = ET.ElementTree(rss); ET.indent(tree, space="  "); tree.write("feed.xml", encoding="utf-8", xml_declaration=True)
          PY
          rm -f .github/workflows/one-shot-news-update.yml .github/news-update-payload.json
          git config user.name "kama.show news automation"
          git config user.email "actions@users.noreply.github.com"
          git add feed.json feed.xml archive/2026-09-01.json .github/workflows/one-shot-news-update.yml .github/news-update-payload.json
          git commit -m "Update personalized news feed for 2026-09-01 21:02 JST"
          git push origin HEAD:main
